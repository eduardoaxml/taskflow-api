components:
  schemas:
    ManageableMembershipRoleEnum:
      enum:
      - ADMIN
      - MEMBER
      type: string
      description: |-
        * `ADMIN` - Admin
        * `MEMBER` - Member
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/OrganizationMembershipRoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - is_active
      - joined_at
      - role
      - user_email
      - user_id
    MembershipCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          allOf:
          - $ref: '#/components/schemas/ManageableMembershipRoleEnum'
          default: MEMBER
      required:
      - email
    MembershipUpdate:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/ManageableMembershipRoleEnum'
      required:
      - role
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - name
      - slug
      - updated_at
    OrganizationMembershipRoleEnum:
      enum:
      - OWNER
      - ADMIN
      - MEMBER
      type: string
      description: |-
        * `OWNER` - Owner
        * `ADMIN` - Admin
        * `MEMBER` - Member
    PaginatedMembershipList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    PaginatedOrganizationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
    PaginatedProjectList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
